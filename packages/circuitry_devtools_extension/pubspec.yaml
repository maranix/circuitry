name: circuitry_devtools_extension
description: Dedicated Flutter DevTools extension for inspecting Circuitry dependency graphs, topological waves, and runtime container health.
version: 0.5.0
homepage: https://github.com/maranix/circuitry
repository: https://github.com/maranix/circuitry/tree/main/packages/circuitry_devtools_extension
issue_tracker: https://github.com/maranix/circuitry/issues?q=is%3Aissue+is%3Aopen+label%3Acircuitry_devtools

resolution: workspace

topics:
  - devtools-extension
  - dependency-injection
  - di
  - flutter
  - debugging

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  circuitry: ^0.5.0
  devtools_extensions: ^0.5.1
  devtools_app_shared: ^0.5.1
  material_ui: ^1.11.1
  vm_service: ^14.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

