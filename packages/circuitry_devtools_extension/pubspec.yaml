name: circuitry_devtools_extension
description: Dedicated Flutter DevTools extension for inspecting Circuitry dependency graphs, topological waves, and runtime container health.
version: 0.2.0
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  devtools_extensions: ^0.5.1
  devtools_app_shared: ^0.5.1
  material_ui: ^1.11.1
  vm_service: ^14.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

