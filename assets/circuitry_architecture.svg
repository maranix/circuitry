<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Accent Gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="accentIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    .title { font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #94a3b8; }
    .step-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
    .card-heading { font-size: 16px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.2px; }
    .body-bold { font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .body-regular { font-size: 12px; font-weight: 400; fill: #94a3b8; line-height: 1.4; }
    .code-text { font-family: "SF Mono", Monaco, "Courier New", monospace; font-size: 12px; font-weight: 600; }
    .badge { font-size: 11px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#canvasBg)" />

  <!-- Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="720" />
    <line x1="600" y1="0" x2="600" y2="720" />
    <line x1="900" y1="0" x2="900" y2="720" />
  </g>

  <!-- Header -->
  <g transform="translate(60, 42)">
    <!-- Circuit Icon / Logo Symbol -->
    <rect x="0" y="2" width="36" height="36" rx="10" fill="#0284c7" />
    <circle cx="18" cy="20" r="6" fill="#ffffff" />
    <line x1="8" y1="20" x2="12" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="20" x2="28" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="18" y1="10" x2="18" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="18" y1="26" x2="18" y2="30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <text x="48" y="22" class="font-sans title">Circuitry</text>
    <text x="160" y="22" class="font-sans title" fill="#38bdf8" font-weight="400">Architecture</text>
    <text x="48" y="44" class="font-sans subtitle">Zero-Codegen Dependency Injection Engine for Dart &amp; Flutter</text>

    <!-- Top Badges -->
    <g transform="translate(730, 8)">
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="50" y="17" text-anchor="middle" class="font-sans badge" fill="#38bdf8">Dart 3.14+</text>

      <rect x="110" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="160" y="17" text-anchor="middle" class="font-sans badge" fill="#34d399">Zero Codegen</text>

      <rect x="220" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="285" y="17" text-anchor="middle" class="font-sans badge" fill="#c084fc">Flutter Companion</text>
    </g>
  </g>

  <!-- ==================== COLUMN 1: DECLARE WIRES ==================== -->
  <g transform="translate(60, 115)">
    <rect width="320" height="375" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    
    <text x="24" y="32" class="font-sans step-tag" fill="#38bdf8">Step 1 • Declare</text>
    <text x="24" y="56" class="font-sans card-heading">Service &amp; Action Recipes</text>

    <!-- 1. Wire<T> -->
    <g transform="translate(20, 74)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#38bdf8" />
      <text x="32" y="26" class="code-text" fill="#38bdf8">Wire&lt;T&gt;</text>
      <text x="140" y="25" class="font-sans body-regular" fill="#64748b">• Standard Service</text>
      <text x="20" y="48" class="font-sans body-regular">Created lazily when your app first asks for it.</text>
    </g>

    <!-- 2. AsyncWire<T> -->
    <g transform="translate(20, 150)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#818cf8" />
      <text x="32" y="26" class="code-text" fill="#818cf8">AsyncWire&lt;T&gt;</text>
      <text x="175" y="25" class="font-sans body-regular" fill="#64748b">• Async Service</text>
      <text x="20" y="48" class="font-sans body-regular">Asynchronously loaded at startup (DB, network).</text>
    </g>

    <!-- 3. TriggerWire<T> -->
    <g transform="translate(20, 226)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.2" />
      <circle cx="20" cy="22" r="5" fill="#2dd4bf" />
      <text x="32" y="26" class="code-text" fill="#2dd4bf">TriggerWire&lt;T&gt;</text>
      <text x="180" y="25" class="font-sans body-regular" fill="#64748b">• Callable Action</text>
      <text x="20" y="48" class="font-sans body-regular">Reusable business action (SendEmail, Checkout).</text>
    </g>

    <!-- Chaining Footer -->
    <g transform="translate(20, 302)">
      <rect width="280" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-dasharray="3 3" />
      <text x="16" y="22" class="code-text" fill="#93c5fd">.takes&lt;A&gt;().to(Service.new)</text>
      <text x="16" y="40" class="font-sans body-regular">Declare dependencies with clean constructor tear-offs.</text>
    </g>
  </g>

  <!-- Flow Arrow: Col 1 -> Col 2 -->
  <line x1="385" y1="300" x2="435" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 2: GRAPH SAFETY & ORDER ==================== -->
  <g transform="translate(440, 115)">
    <rect width="320" height="375" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    
    <text x="24" y="32" class="font-sans step-tag" fill="#f59e0b">Step 2 • Compile</text>
    <text x="24" y="56" class="font-sans card-heading">Automatic Safety &amp; Order</text>

    <!-- Feature 1: Order Detection -->
    <g transform="translate(20, 74)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="18" y="26" class="font-sans body-bold" fill="#f8fafc">Automatic Order Resolution</text>
      <text x="18" y="48" class="font-sans body-regular">Dependencies are always loaded before dependents,</text>
      <text x="18" y="62" class="font-sans body-regular">without manual ordering or boilerplate.</text>
    </g>

    <!-- Feature 2: Missing Check -->
    <g transform="translate(20, 150)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="18" y="26" class="font-sans body-bold" fill="#f8fafc">Missing Wire Verification</text>
      <text x="18" y="48" class="font-sans body-regular">Catches missing dependencies before runtime</text>
      <text x="18" y="62" class="font-sans body-regular">with precise, helpful error messages.</text>
    </g>

    <!-- Feature 3: Cycle Prevention -->
    <g transform="translate(20, 226)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="18" y="26" class="font-sans body-bold" fill="#f8fafc">Cycle &amp; Deadlock Prevention</text>
      <text x="18" y="48" class="font-sans body-regular">Graph algorithm detects circular loops instantly</text>
      <text x="18" y="62" class="font-sans body-regular">and reports the exact dependency chain.</text>
    </g>

    <!-- Guarantee Footer -->
    <g transform="translate(20, 302)">
      <rect width="280" height="52" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#059669" />
      <text x="16" y="24" class="font-sans body-bold" fill="#34d399">✓ Fail-Safe Startup Guarantee</text>
      <text x="16" y="42" class="font-sans body-regular">If an async service fails, resources clean up cleanly.</text>
    </g>
  </g>

  <!-- Flow Arrow: Col 2 -> Col 3 -->
  <line x1="765" y1="300" x2="815" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 3: RUNTIME CONTAINER ==================== -->
  <g transform="translate(820, 115)">
    <rect width="320" height="375" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    
    <text x="24" y="32" class="font-sans step-tag" fill="#10b981">Step 3 • Run</text>
    <text x="24" y="56" class="font-sans card-heading">Fast Retrieval &amp; Teardown</text>

    <!-- 1. Instant Reads -->
    <g transform="translate(20, 74)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="18" y="26" class="code-text" fill="#34d399">circuit.get&lt;T&gt;()</text>
      <text x="18" y="48" class="font-sans body-regular">Instant, synchronous O(1) retrieval (&gt; 50M ops/sec)</text>
      <text x="18" y="62" class="font-sans body-regular">with zero reflection and zero code generation.</text>
    </g>

    <!-- 2. Action Calls -->
    <g transform="translate(20, 150)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#2dd4bf" stroke-width="1" />
      <text x="18" y="26" class="code-text" fill="#2dd4bf">circuit.get&lt;Action&gt;()(...)</text>
      <text x="18" y="48" class="font-sans body-regular">Run business actions directly with zero memory</text>
      <text x="18" y="62" class="font-sans body-regular">churn or garbage collection overhead.</text>
    </g>

    <!-- 3. Clean Teardown -->
    <g transform="translate(20, 226)">
      <rect width="280" height="66" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
      <text x="18" y="26" class="code-text" fill="#fb7185">circuit.dispose()</text>
      <text x="18" y="48" class="font-sans body-regular">Safe shutdown: closes dependent services first,</text>
      <text x="18" y="62" class="font-sans body-regular">then root databases and network connections.</text>
    </g>

    <!-- DevTools Footer -->
    <g transform="translate(20, 302)">
      <rect width="280" height="52" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-dasharray="3 3" />
      <text x="16" y="22" class="font-sans body-bold" fill="#c084fc">DevTools Extension Ready</text>
      <text x="16" y="40" class="font-sans body-regular">Visualize graphs and inspect services live.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM PANEL: FLUTTER INTEGRATION ==================== -->
  <g transform="translate(60, 510)">
    <rect width="1080" height="175" rx="12" fill="url(#cardBg)" stroke="#475569" stroke-width="1.2" filter="url(#shadow)" />
    
    <text x="24" y="30" class="font-sans step-tag" fill="#c084fc">Flutter Integration • package:circuitry_flutter</text>
    <text x="24" y="52" class="font-sans card-heading">Seamless UI Connection Without Boilerplate</text>

    <!-- Feature 1: CircuitProvider -->
    <g transform="translate(20, 68)">
      <rect width="325" height="88" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="16" y="24" class="code-text" fill="#a5b4fc">CircuitProvider</text>
      <text x="16" y="46" class="font-sans body-regular">Wraps your app or feature screens.</text>
      <text x="16" y="62" class="font-sans body-regular">Handles async initialization and auto-cleanup</text>
      <text x="16" y="78" class="font-sans body-regular">when screens are removed from the tree.</text>
    </g>

    <!-- Feature 2: States -->
    <g transform="translate(365, 68)">
      <rect width="345" height="88" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="16" y="24" class="font-sans body-bold" fill="#c4b5fd">Reactive UI States</text>
      <text x="16" y="46" class="font-sans body-regular">Pattern match cleanly with Dart switch expressions:</text>
      <text x="16" y="64" class="font-sans body-regular" fill="#a5b4fc">CircuitBuilding ➔ Splash / Loading</text>
      <text x="16" y="80" class="font-sans body-regular" fill="#34d399">CircuitReady ➔ Main App UI</text>
    </g>

    <!-- Feature 3: CircuitBuilder -->
    <g transform="translate(730, 68)">
      <rect width="330" height="88" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="16" y="24" class="code-text" fill="#a5b4fc">CircuitBuilder&lt;T&gt;</text>
      <text x="16" y="46" class="font-sans body-regular">Read services inside leaf widgets directly.</text>
      <text x="16" y="62" class="font-sans body-regular">Rebuilds only the widget that needs it,</text>
      <text x="16" y="78" class="font-sans body-regular">avoiding full-screen re-renders.</text>
    </g>
  </g>
</svg>