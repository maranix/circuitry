<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .node-text { font-family: "SF Mono", Monaco, "Courier New", monospace; font-size: 11.5px; font-weight: 600; fill: #e2e8f0; }
    .node-subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #38bdf8; }
    .wave-tag { font-family: "SF Mono", Monaco, monospace; font-size: 10px; font-weight: 700; fill: #a5b4fc; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="720" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="300" y1="0" x2="300" y2="720" />
    <line x1="600" y1="0" x2="600" y2="720" />
    <line x1="900" y1="0" x2="900" y2="720" />
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 36)">
    <text x="0" y="24" class="title">Circuitry</text>
    <text x="120" y="24" class="title" fill="#38bdf8" opacity="0.8">Architecture</text>
    <text x="0" y="48" class="subtitle">Directed Acyclic Graph (DAG) Dependency Injection Engine &amp; Flutter Lifecycle Scoping</text>
    
    <!-- Badges -->
    <g transform="translate(770, 8)">
      <rect x="0" y="0" width="105" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
      <text x="52" y="16" text-anchor="middle" class="badge-text" fill="#38bdf8">Pure Dart 3.14+</text>

      <rect x="115" y="0" width="95" height="24" rx="12" fill="#047857" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
      <text x="162" y="16" text-anchor="middle" class="badge-text" fill="#34d399">Zero Codegen</text>

      <rect x="220" y="0" width="95" height="24" rx="12" fill="#6d28d9" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1" />
      <text x="267" y="16" text-anchor="middle" class="badge-text" fill="#c084fc">Flutter Bridge</text>
    </g>
  </g>

  <!-- ==================== COLUMN 1: DECLARATIVE WIRES ==================== -->
  <g transform="translate(50, 105)">
    <rect width="250" height="365" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <text x="20" y="30" class="card-subtitle">STAGE 1: DECLARATION</text>
    <text x="20" y="50" class="card-title">Declarative Wire Recipes</text>

    <!-- Sync Wire Item -->
    <g transform="translate(18, 68)">
      <rect width="214" height="64" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="16" cy="20" r="5" fill="#06b6d4" />
      <text x="28" y="24" class="node-text">Wire&lt;T&gt;</text>
      <text x="16" y="44" class="node-subtext">Synchronous lazy singleton</text>
      <text x="16" y="56" class="node-subtext">Evaluated on first get&lt;T&gt;()</text>
    </g>

    <!-- Async Wire Item -->
    <g transform="translate(18, 142)">
      <rect width="214" height="64" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="16" cy="20" r="5" fill="#3b82f6" />
      <text x="28" y="24" class="node-text">AsyncWire&lt;T&gt;</text>
      <text x="16" y="44" class="node-subtext">Asynchronous singleton</text>
      <text x="16" y="56" class="node-subtext">Resolved in parallel waves</text>
    </g>

    <!-- Wire Keys & Chaining -->
    <g transform="translate(18, 216)">
      <rect width="214" height="130" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="node-text" fill="#93c5fd">(Type, Enum?) Key</text>
      <text x="14" y="38" class="node-subtext">Untagged: (T, null)</text>
      <text x="14" y="52" class="node-subtext">Tagged: (T, Environment.prod)</text>
      
      <line x1="14" y1="62" x2="200" y2="62" stroke="#334155" stroke-width="1" />
      
      <text x="14" y="80" class="node-text" fill="#38bdf8">.takes&lt;A&gt;().to(...)</text>
      <text x="14" y="96" class="node-subtext">Type-safe accumulators</text>
      <text x="14" y="110" class="node-subtext">Tear-offs: Service.new</text>
    </g>
  </g>

  <!-- Arrow: Col 1 -> Col 2 -->
  <path d="M 300 287 L 335 287" stroke="#06b6d4" stroke-width="2" fill="none" marker-end="url(#arrowCyan)" />

  <!-- ==================== COLUMN 2: DAG COMPILER & VALIDATION ==================== -->
  <g transform="translate(345, 105)">
    <rect width="230" height="365" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <text x="20" y="30" class="card-subtitle">STAGE 2: COMPILATION</text>
    <text x="20" y="50" class="card-title">Circuit.build(wires)</text>

    <!-- Check 1 -->
    <g transform="translate(18, 68)">
      <rect width="194" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="14" y="24" class="node-text" fill="#fbbf24">Cycle Detection</text>
      <text x="14" y="42" class="node-subtext">Depth-First Search (DFS)</text>
      <text x="14" y="56" class="node-subtext">Throws CircularDependency</text>
    </g>

    <!-- Check 2 -->
    <g transform="translate(18, 148)">
      <rect width="194" height="68" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="14" y="24" class="node-text" fill="#fbbf24">Missing Dependency</text>
      <text x="14" y="42" class="node-subtext">Key graph integrity audit</text>
      <text x="14" y="56" class="node-subtext">Throws MissingWireException</text>
    </g>

    <!-- Check 3 -->
    <g transform="translate(18, 226)">
      <rect width="194" height="68" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="14" y="24" class="node-text" fill="#fbbf24">Duplicate Wire Keys</text>
      <text x="14" y="42" class="node-subtext">Duplicate (T, tag) rejection</text>
      <text x="14" y="56" class="node-subtext">Throws DuplicateWire</text>
    </g>

    <text x="115" y="336" text-anchor="middle" class="node-subtext" fill="#10b981" font-weight="600">✓ Validated DAG Guaranteed</text>
  </g>

  <!-- Arrow: Col 2 -> Col 3 -->
  <path d="M 575 287 L 610 287" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowAmber)" />

  <!-- ==================== COLUMN 3: PARALLEL TOPOLOGICAL WAVES ==================== -->
  <g transform="translate(620, 105)">
    <rect width="280" height="365" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
    
    <text x="20" y="30" class="card-subtitle">STAGE 3: TOPOLOGICAL WAVES</text>
    <text x="20" y="50" class="card-title">Parallel Resolution Engine</text>

    <!-- Wave 0: Roots -->
    <g transform="translate(18, 66)">
      <rect width="244" height="58" rx="8" fill="#1e1e38" stroke="#818cf8" stroke-width="1.2" />
      <text x="14" y="20" class="wave-tag">WAVE 0: INDEPENDENT ROOTS</text>
      <rect x="14" y="28" width="102" height="22" rx="4" fill="#312e81" />
      <text x="65" y="43" text-anchor="middle" class="node-text" font-size="9.5">Async: Config</text>
      <rect x="124" y="28" width="102" height="22" rx="4" fill="#0f766e" />
      <text x="175" y="43" text-anchor="middle" class="node-text" font-size="9.5">Sync: Logger</text>
    </g>

    <!-- Down arrow -->
    <path d="M 140 126 L 140 138" stroke="#818cf8" stroke-width="2" fill="none" marker-end="url(#arrowCyan)" />

    <!-- Wave 1: Mid-tier -->
    <g transform="translate(18, 140)">
      <rect width="244" height="58" rx="8" fill="#1e1e38" stroke="#818cf8" stroke-width="1.2" />
      <text x="14" y="20" class="wave-tag">WAVE 1: CORE SERVICES</text>
      <rect x="14" y="28" width="102" height="22" rx="4" fill="#312e81" />
      <text x="65" y="43" text-anchor="middle" class="node-text" font-size="9.5">Async: Database</text>
      <rect x="124" y="28" width="102" height="22" rx="4" fill="#312e81" />
      <text x="175" y="43" text-anchor="middle" class="node-text" font-size="9.5">Async: ApiClient</text>
    </g>

    <!-- Down arrow -->
    <path d="M 140 200 L 140 212" stroke="#818cf8" stroke-width="2" fill="none" marker-end="url(#arrowCyan)" />

    <!-- Wave 2: Consumers -->
    <g transform="translate(18, 214)">
      <rect width="244" height="58" rx="8" fill="#1e1e38" stroke="#818cf8" stroke-width="1.2" />
      <text x="14" y="20" class="wave-tag">WAVE 2: LEAF CONSUMERS</text>
      <rect x="14" y="28" width="102" height="22" rx="4" fill="#0f766e" />
      <text x="65" y="43" text-anchor="middle" class="node-text" font-size="9.5">Sync: UserService</text>
      <rect x="124" y="28" width="102" height="22" rx="4" fill="#0f766e" />
      <text x="175" y="43" text-anchor="middle" class="node-text" font-size="9.5">Sync: Orders</text>
    </g>

    <!-- Dedicated Teardown & Build Flow Box (No Overlap) -->
    <g transform="translate(18, 288)">
      <rect width="244" height="62" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="node-subtext" fill="#34d399" font-weight="600">▶ Build Waves: 0 → 1 → 2 (Concurrent)</text>
      <line x1="14" y1="31" x2="230" y2="31" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="48" class="node-subtext" fill="#fb7185" font-weight="600">◀ Reverse Teardown: 2 → 1 → 0 (Idempotent)</text>
    </g>
  </g>

  <!-- Arrow: Col 3 -> Col 4 -->
  <path d="M 900 287 L 935 287" stroke="#818cf8" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" />

  <!-- ==================== COLUMN 4: COMPILED CIRCUIT ==================== -->
  <g transform="translate(945, 105)">
    <rect width="205" height="365" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    
    <text x="18" y="30" class="card-subtitle">STAGE 4: RUNTIME</text>
    <text x="18" y="50" class="card-title">Circuit Container</text>

    <!-- O(1) Reads -->
    <g transform="translate(16, 68)">
      <rect width="173" height="72" rx="8" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.2" />
      <text x="12" y="24" class="node-text" fill="#34d399">O(1) Synchronous</text>
      <text x="12" y="44" class="node-subtext">circuit.get&lt;T&gt;()</text>
      <text x="12" y="58" class="node-subtext">circuit.getTagged&lt;T, K&gt;()</text>
    </g>

    <!-- Lazy Eval -->
    <g transform="translate(16, 148)">
      <rect width="173" height="72" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="12" y="24" class="node-text" fill="#e2e8f0">Lazy Instantiation</text>
      <text x="12" y="44" class="node-subtext">Sync wires constructed</text>
      <text x="12" y="58" class="node-subtext">only upon first read</text>
    </g>

    <!-- Teardown -->
    <g transform="translate(16, 228)">
      <rect width="173" height="105" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
      <text x="12" y="24" class="node-text" fill="#fb7185">circuit.dispose()</text>
      <text x="12" y="44" class="node-subtext">Idempotent teardown</text>
      <text x="12" y="60" class="node-subtext">Parallel onDispose hooks</text>
      <text x="12" y="76" class="node-subtext">Leaves disposed first</text>
      <text x="12" y="92" class="node-subtext">DisposalException agg.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM ROW: FLUTTER INTEGRATION ==================== -->
  <g transform="translate(50, 490)">
    <rect width="1100" height="190" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" />
    
    <text x="24" y="30" class="card-subtitle">STAGE 5: FLUTTER BRIDGE (package:circuitry_flutter)</text>
    <text x="24" y="50" class="card-title">CircuitProvider &amp; InheritedWidget Scoping</text>

    <!-- State Lifecycle Block -->
    <g transform="translate(24, 72)">
      <rect width="320" height="96" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2" />
      <text x="16" y="24" class="node-text" fill="#c4b5fd">Sealed CircuitState Matching</text>
      <text x="16" y="46" class="node-subtext">CircuitBuilding ➔ Loading / Splash Screen</text>
      <text x="16" y="64" class="node-subtext">CircuitReady(:circuit) ➔ Active App UI</text>
      <text x="16" y="82" class="node-subtext">CircuitFailure(:error) ➔ Failure Recovery</text>
    </g>

    <!-- Arrow inside bottom -->
    <path d="M 358 120 L 388 120" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" />

    <!-- Context Scope Block -->
    <g transform="translate(398, 72)">
      <rect width="320" height="96" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2" />
      <text x="16" y="24" class="node-text" fill="#c4b5fd">Scoped Context Lookup</text>
      <text x="16" y="46" class="node-subtext">CircuitProvider.of(context)</text>
      <text x="16" y="64" class="node-subtext">CircuitProvider.maybeOf(context)</text>
      <text x="16" y="82" class="node-subtext">Zero BuildContext extension pollution</text>
    </g>

    <!-- Arrow inside bottom -->
    <path d="M 732 120 L 762 120" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" />

    <!-- Lifecycle Safety Block -->
    <g transform="translate(772, 72)">
      <rect width="304" height="96" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2" />
      <text x="16" y="24" class="node-text" fill="#c4b5fd">Lifecycle Race Prevention</text>
      <text x="16" y="46" class="node-subtext">Monotonic epoch tracking for didUpdateWidget</text>
      <text x="16" y="64" class="node-subtext">Cancels superseded in-flight builds</text>
      <text x="16" y="82" class="node-subtext">Automatic unmount dispose()</text>
    </g>
  </g>
</svg>
