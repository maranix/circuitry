name: CI

on:
  push:
    branches: [ main ]
  pull_request_review:
    types: [ submitted ]
  workflow_dispatch:

jobs:
  verify:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Workspace Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Pure Dart Tests (circuitry)
        run: |
          cd packages/circuitry
          dart test

      - name: Run Flutter Tests (circuitry_flutter)
        run: |
          cd packages/circuitry_flutter
          flutter test

      - name: Run DevTools Extension Tests (circuitry_devtools_extension)
        run: |
          cd packages/circuitry_devtools_extension
          flutter test

      - name: Run Analyzer Plugin Tests (circuitry_analyzer_plugin)
        run: |
          cd packages/circuitry_analyzer_plugin
          dart test
